[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yayt-mcp"
version = "0.1.0"
description = "Yet Another YouTrack MCP server for Claude Code, Cursor, JetBrains AI, and any MCP client"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "mcp>=1.3.0,<2",
    "httpx[http2]>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
yayt-mcp = "yt_mcp.server:main"
youtrack-mcp = "yt_mcp.server:main"
yt-mcp = "yt_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/yt_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

